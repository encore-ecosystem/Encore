[project]
name = "encore"
version = "0.0.1"
description = ""
readme = "README.md"
licence = "MIT"
# The compiler remains self-hosting through local path dependencies. Release
# artifacts embed the exact compatible system-library sources used here.
dependencies = [ "path@../encore-index/packages/std", "path@../encore-index/packages/rich", "path@../encore-index/packages/json", "path@../encore-index/packages/ehir", "path@../encore-index/packages/ehir-llvm-backend", "path@../encore-index/packages/toml", "path@../encore-index/packages/colorterm", "path@../encore-index/packages/argparse",]

[target.x86_64-unknown-linux-gnu]
link-args = ["-lssl", "-lcrypto", "-Wl,--allow-multiple-definition"]

[target.aarch64-unknown-linux-gnu]
link-args = ["-lssl", "-lcrypto"]
