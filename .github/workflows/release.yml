name: Promote Native Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
      - "v[0-9]*.[0-9]*.[0-9]*-beta.[0-9]*"
      - "v[0-9]*.[0-9]*.[0-9]*-beta.[0-9]*.[0-9]*"
      - "v[0-9]*.[0-9]*.[0-9]*-nightly.[0-9]*"
      - "v[0-9]*.[0-9]*.[0-9]*-[a-z]*"

permissions:
  actions: read
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify tag and exact green trunk candidate
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          release=$(tr -d '\r\n' < VERSION)
          version=${release%%-*}
          release_name=${release#*-}
          test "${GITHUB_REF_NAME#v}" = "$release"
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' encore.toml | head -n 1)" = "$version"
          test "$release" = "$version-$release_name"
          grep -Fq "ret \"$version\"" src/version.enq
          grep -Fq "ret \"$release_name\"" src/version.enq
          grep -Fq "ret \"$release\"" src/version.enq
          if [[ "$release" =~ ^[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]{8}$ ]]; then
            channel=nightly
          elif [[ "$release" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+(\.[0-9]+)?$ ]]; then
            channel=beta
          elif [[ "$release_name" =~ ^[a-z][a-z0-9-]*$ ]] && test "$release" = "$version-$release_name"; then
            channel=stable
          else
            echo "::error::Unsupported release version $release"
            exit 1
          fi
          git fetch origin trunk
          git merge-base --is-ancestor "$GITHUB_SHA" origin/trunk
          run_id=$(gh run list \
            --workflow ci.yml \
            --branch trunk \
            --commit "$GITHUB_SHA" \
            --status success \
            --limit 20 \
            --json databaseId,headSha,conclusion,event \
            --jq 'map(select(.headSha == env.GITHUB_SHA and .conclusion == "success" and (.event == "push" or .event == "workflow_dispatch"))) | first | .databaseId')
          test -n "$run_id" && test "$run_id" != null || {
            echo "::error::No successful trunk CI run exists for exact commit $GITHUB_SHA"
            exit 1
          }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "display_name=${release_name^}" >> "$GITHUB_OUTPUT"

      - name: Download exact tested artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for triple in \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu \
            x86_64-apple-darwin \
            aarch64-apple-darwin \
            x86_64-pc-windows-msvc \
            x86_64-w64-windows-gnu \
            aarch64-w64-windows-gnu
          do
            gh run download "${{ steps.candidate.outputs.run_id }}" \
              --name "release-candidate-$triple" \
              --dir "target/candidates/$triple"
            cp "target/candidates/$triple"/* dist/
          done
          for target in \
            x86_64-w64-windows-gnu \
            aarch64-w64-windows-gnu \
            aarch64-unknown-linux-gnu
          do
            gh run download "${{ steps.candidate.outputs.run_id }}" \
              --name "release-candidate-target-kit-$target" \
              --dir "target/candidates/target-kit-$target"
            cp "target/candidates/target-kit-$target"/* dist/
          done

      - name: Verify provenance and generate release manifest
        shell: bash
        env:
          CHANNEL: ${{ steps.candidate.outputs.channel }}
        run: |
          set -euo pipefail
          release=$(tr -d '\r\n' < VERSION)
          version=${release%%-*}
          release_name=${release#*-}
          assets=
          # All targets must originate from the same resolved build inputs.
          jq -se '
            length == 7 and
            ([.[] | [.seed, .index_commit, .dependencies_sha256]] | unique | length) == 1
          ' dist/provenance-*.json >/dev/null
          : > dist/SHA256SUMS
          for triple in \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu \
            x86_64-apple-darwin \
            aarch64-apple-darwin \
            x86_64-pc-windows-msvc \
            x86_64-w64-windows-gnu \
            aarch64-w64-windows-gnu
          do
            jq -e --arg commit "$GITHUB_SHA" --arg version "$version" \
              --arg nametag "$release_name" --arg release "$release" --arg target "$triple" '
              .schema == 2 and .commit == $commit and .version == $version and
              .nametag == $nametag and .release == $release and .target == $target and
              .converged == true and
              (.index_commit | type == "string" and test("^[0-9a-f]{40}$")) and
              (.seed | type == "string" and length > 0) and
              ([.compiler_sha256, .lsp_sha256, .stage2_sha256, .stage3_sha256,
                .dependencies_sha256] | all(.[]; type == "string" and test("^[0-9a-f]{64}$"))) and
              .stage2_sha256 == .stage3_sha256 and .stage3_sha256 == .compiler_sha256
              ' "dist/provenance-$triple.json" >/dev/null
            extension=tar.gz
            format=tar.gz
            case "$triple" in *-windows-*) extension=zip; format=zip ;; esac
            asset="encore-$triple.$extension"
            expected=$(awk 'NF {print tolower($1); exit}' "dist/$asset.sha256")
            actual=$(sha256sum "dist/$asset" | awk '{print $1}')
            test "$actual" = "$expected"
            python3 - "$triple" "$release" "dist/$asset" <<'PY'
          import hashlib
          import json
          import sys
          import tarfile
          import zipfile

          triple, release, archive_path = sys.argv[1:]
          with open(f"dist/provenance-{triple}.json", encoding="utf-8") as source:
              provenance = json.load(source)
          root = f"encore-{release}-{triple}"
          windows = "-windows-" in triple
          archive = zipfile.ZipFile(archive_path) if windows else tarfile.open(archive_path)
          with archive:
              def read_member(name):
                  path = f"{root}/{name}"
                  if windows:
                      if archive.namelist().count(path) != 1:
                          raise ValueError(f"missing or duplicate archive member: {path}")
                      return archive.open(path)
                  members = [entry for entry in archive.getmembers() if entry.name == path]
                  if len(members) != 1 or not members[0].isfile():
                      raise ValueError(f"missing, duplicate, or non-file archive member: {path}")
                  return archive.extractfile(members[0])

              with read_member("VERSION") as source:
                  if source.read().decode().strip() != release:
                      raise ValueError("archive release identity does not match tag")
              for binary, key in (("encore", "compiler_sha256"), ("encore-lsp", "lsp_sha256")):
                  with read_member(f"bin/{binary}" + (".exe" if windows else "")) as source:
                      digest = hashlib.file_digest(source, "sha256").hexdigest()
                  if digest != provenance[key]:
                      raise ValueError(f"archive {binary} does not match verified provenance")
          PY
            printf '%s  %s\n' "$actual" "$asset" >> dist/SHA256SUMS
            entry="{\"triple\":\"$triple\",\"url\":\"https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$asset\",\"sha256\":\"$actual\",\"format\":\"$format\"}"
            if test -n "$assets"; then assets="$assets,$entry"; else assets=$entry; fi
          done
          for descriptor in dist/target-kit-*.json; do
            test "$(jq -r '.schema' "$descriptor")" = 1
            target_kit_abi=$(printf '%s\n' "$version" | awk -F. '{print $1 "." $2}')
            test "$(jq -r '.abi' "$descriptor")" = "$target_kit_abi"
            archive=$(basename "$(jq -r '.archive' "$descriptor")")
            expected=$(jq -r '.sha256' "$descriptor")
            test "$expected" = "$(sha256sum "dist/$archive" | awk '{print $1}')"
            test "$expected" = "$(awk 'NF {print tolower($1); exit}' "dist/$archive.sha256")"
            printf '%s  %s\n' "$expected" "$archive" >> dist/SHA256SUMS
          done
          LC_ALL=C sort -o dist/SHA256SUMS dist/SHA256SUMS
          printf '{"schema":2,"channel":"%s","version":"%s","nametag":"%s","release":"%s","tag":"%s","commit":"%s","verification":{"converged":true,"targets":7},"assets":[%s]}\n' \
            "$CHANNEL" "$version" "$release_name" "$release" "$GITHUB_REF_NAME" "$GITHUB_SHA" \
            "$assets" > dist/channel.json

      - uses: softprops/action-gh-release@v3
        with:
          # Immutable releases must receive every asset while they are still a
          # draft. Publishing a prerelease first makes all subsequent uploads
          # fail, leaving behind an empty release.
          draft: true
          files: |
            dist/encore-*
            dist/target-kit-*
            dist/SHA256SUMS
            dist/channel.json
            dist/provenance-*
          generate_release_notes: true
          name: Encore ${{ steps.candidate.outputs.version }} — ${{ steps.candidate.outputs.display_name }}
          prerelease: ${{ steps.candidate.outputs.channel != 'stable' }}

      - name: Publish immutable release
        shell: bash
        env:
          CHANNEL: ${{ steps.candidate.outputs.channel }}
        run: |
          set -euo pipefail
          if test "$CHANNEL" = stable; then
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest
          else
            gh release edit "$GITHUB_REF_NAME" --draft=false --latest=false
          fi

      - name: Publish atomic channel pointer
        shell: bash
        env:
          CHANNEL: ${{ steps.candidate.outputs.channel }}
        run: |
          set -euo pipefail
          pointer_branch="release-channel-$CHANNEL"
          pointer_index=$(mktemp)
          trap 'rm -f "$pointer_index"' EXIT
          export GIT_INDEX_FILE=$pointer_index
          parent_args=()
          git read-tree --empty
          if git fetch origin "refs/heads/$pointer_branch"; then
            git read-tree FETCH_HEAD
            parent_args=(-p FETCH_HEAD)
          fi
          blob=$(git hash-object -w dist/channel.json)
          git update-index --add --cacheinfo 100644 "$blob" channel.json
          tree=$(git write-tree)
          export GIT_AUTHOR_NAME=github-actions GIT_COMMITTER_NAME=github-actions
          export GIT_AUTHOR_EMAIL=41898282+github-actions[bot]@users.noreply.github.com
          export GIT_COMMITTER_EMAIL=$GIT_AUTHOR_EMAIL
          commit=$(printf 'Update %s release channel to %s\n' "$CHANNEL" "$GITHUB_REF_NAME" | \
            git commit-tree "$tree" "${parent_args[@]}")
          git push origin "$commit:refs/heads/$pointer_branch"
