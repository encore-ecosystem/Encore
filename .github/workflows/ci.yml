name: Native CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [trunk]

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  resolve-inputs:
    name: Resolve trusted inputs
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ENCORE_REGISTRY_CACHE: ${{ github.workspace }}/target/dependencies/registry
    outputs:
      seed_tag: ${{ steps.seed.outputs.tag }}
      index_sha: ${{ steps.index.outputs.sha }}
    steps:
      - uses: actions/checkout@v6
      - name: Select latest stable compiler once
        id: seed
        shell: bash
        run: |
          set -euo pipefail
          required='[
            "encore-x86_64-unknown-linux-gnu.tar.gz",
            "encore-aarch64-unknown-linux-gnu.tar.gz",
            "encore-x86_64-apple-darwin.tar.gz",
            "encore-aarch64-apple-darwin.tar.gz",
            "encore-x86_64-pc-windows-msvc.zip"
          ]'
          releases=$(gh release list --limit 100 --json tagName,publishedAt,isDraft,isPrerelease)
          selected=$(jq -r '[.[] | select(.isDraft == false and .isPrerelease == false)
            | select(.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+(-[a-z][a-z0-9-]*)?$"))]
            | sort_by(.publishedAt) | last | .tagName // empty' <<<"$releases")
          test -n "$selected" || { echo "::error::No stable compiler release is available"; exit 1; }
          assets=$(gh release view "$selected" --json isDraft,isPrerelease,assets)
          test "$(jq -r '.isDraft or .isPrerelease' <<<"$assets")" = false
          if ! jq -e --argjson required "$required" \
            '([.assets[].name] as $actual | $required - $actual | length) == 0' <<<"$assets" >/dev/null
          then
            echo "::error::Latest stable seed $selected is incomplete; refusing an older fallback"
            exit 1
          fi
          echo "tag=$selected" >> "$GITHUB_OUTPUT"
          echo "### Trusted seed: \`$selected\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Pin system-library source
        id: index
        shell: bash
        run: |
          set -euo pipefail
          release=$(tr -d '\r\n' < VERSION)
          version=${release%%-*}
          release_name=${release#*-}
          test "$release" = "$version-$release_name"
          sha=$(git ls-remote https://github.com/encore-ecosystem/encore-index.git refs/heads/main | awk '{print $1}')
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "ENCORE_INDEX_URL=https://raw.githubusercontent.com/encore-ecosystem/encore-index/$sha" >> "$GITHUB_ENV"
          echo "### System libraries: \`$sha\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v6
        with:
          repository: encore-ecosystem/encore-index
          ref: ${{ steps.index.outputs.sha }}
          path: target/dependency-source

      - name: Build verified dependency bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/dependencies/registry
          cp encore.lock target/dependencies/encore.lock
          test "$(git -C target/dependency-source rev-parse HEAD)" = "${{ steps.index.outputs.sha }}"
          mkdir -p target/dependencies/system-index
          git -C target/dependency-source archive HEAD | tar -xf - -C target/dependencies/system-index
          printf '%s\n' '${{ steps.index.outputs.sha }}' > target/dependencies/index-commit
          find target/dependencies -exec touch -t 200001010000.00 {} +
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            -C target -czf target/dependencies.tar.gz dependencies
          sha256sum target/dependencies.tar.gz > target/dependencies.tar.gz.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: trusted-dependencies
          path: |
            target/dependencies.tar.gz
            target/dependencies.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  stage1:
    name: Produce stage1 on ${{ matrix.producer }}
    needs: [resolve-inputs, target-kits]
    strategy:
      fail-fast: false
      matrix:
        include:
          - producer: linux
            os: ubuntu-latest
            seed_triple: x86_64-unknown-linux-gnu
            seed_executable: encore
            targets: >-
              x86_64-unknown-linux-gnu
              aarch64-unknown-linux-gnu
              x86_64-w64-windows-gnu
              aarch64-w64-windows-gnu
          - producer: darwin
            os: macos-15
            seed_triple: aarch64-apple-darwin
            seed_executable: encore
            targets: aarch64-apple-darwin
          - producer: darwin-intel
            os: macos-15-intel
            seed_triple: x86_64-apple-darwin
            seed_executable: encore
            targets: x86_64-apple-darwin
          - producer: windows
            os: windows-latest
            seed_triple: x86_64-pc-windows-msvc
            seed_executable: encore.exe
            targets: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      ENCORE_REGISTRY_CACHE: ${{ github.workspace }}/target/registry
      ENCORE_INDEX_URL: https://raw.githubusercontent.com/encore-ecosystem/encore-index/${{ needs.resolve-inputs.outputs.index_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: trusted-dependencies
          path: target/dependency-download

      - name: Download locally built target kits
        if: matrix.producer == 'linux'
        uses: actions/download-artifact@v8
        with:
          pattern: release-candidate-target-kit-*
          path: target/target-kit-download
          merge-multiple: true

      - name: Activate locally built target kits
        if: matrix.producer == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          release=$(tr -d '\r\n' < VERSION)
          version=${release%%-*}
          release_name=${release#*-}
          abi=$(printf '%s\n' "$version" | awk -F. '{print $1 "." $2}')
          targets_root="$PWD/target/installed-target-kits"
          mkdir -p "$targets_root/$abi"
          for manifest in target/target-kit-download/target-kit-*.json; do
            test "$(jq -r '.schema' "$manifest")" = 1
            test "$(jq -r '.abi' "$manifest")" = "$abi"
            test "$(jq -r '.host' "$manifest")" = x86_64-unknown-linux-gnu
            target=$(jq -r '.target' "$manifest")
            archive="target/target-kit-download/target-kit-x86_64-unknown-linux-gnu--$target.tar.xz"
            expected=$(jq -r '.sha256' "$manifest")
            test "$(sha256sum "$archive" | awk '{print $1}')" = "$expected"
            mkdir -p "$targets_root/$abi/$target"
            tar -xJf "$archive" -C "$targets_root/$abi/$target"
          done
          echo "ENCORE_TARGETS_DIR=$targets_root" >> "$GITHUB_ENV"

      - name: Activate verified offline dependencies
        shell: bash
        run: |
          set -euo pipefail
          expected=$(awk 'NF {print tolower($1); exit}' target/dependency-download/dependencies.tar.gz.sha256)
          if command -v sha256sum >/dev/null 2>&1; then
            actual=$(sha256sum target/dependency-download/dependencies.tar.gz | awk '{print $1}')
          else
            actual=$(shasum -a 256 target/dependency-download/dependencies.tar.gz | awk '{print $1}')
          fi
          test "$actual" = "$expected"
          tar -xzf target/dependency-download/dependencies.tar.gz -C target
          mv target/dependencies/registry target/registry
          cmp <(tr -d '\r' < encore.lock) target/dependencies/encore.lock
          test "$(cat target/dependencies/index-commit)" = "${{ needs.resolve-inputs.outputs.index_sha }}"
          mv target/dependencies/system-index target/system-index
          index_root="$PWD/../encore-index"
          test ! -e "$index_root"
          cp -R target/system-index "$index_root"
          echo "ENCORE_CORE_DIR=$index_root/packages/core" >> "$GITHUB_ENV"
          echo "ENCORE_INDEX_URL=http://127.0.0.1:9" >> "$GITHUB_ENV"

      - name: Download and verify producer seed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/seed
          extension=tar.gz
          [[ "${{ matrix.seed_triple }}" == *-windows-* ]] && extension=zip
          asset="encore-${{ matrix.seed_triple }}.$extension"
          gh release download "${{ needs.resolve-inputs.outputs.seed_tag }}" \
            --pattern "$asset" --pattern "$asset.sha256" --dir target/seed
          expected=$(awk 'NF {print tolower($1); exit}' "target/seed/$asset.sha256")
          if command -v sha256sum >/dev/null 2>&1; then
            actual=$(sha256sum "target/seed/$asset" | awk '{print $1}')
          else
            actual=$(shasum -a 256 "target/seed/$asset" | awk '{print $1}')
          fi
          test "$actual" = "$expected"
          mkdir -p target/seed-unpacked
          case "$extension" in
            zip) unzip -q "target/seed/$asset" -d target/seed-unpacked ;;
            *) tar -xzf "target/seed/$asset" -C target/seed-unpacked ;;
          esac
          distribution=$(find target/seed-unpacked -mindepth 1 -maxdepth 1 -type d | head -n 1)
          seed="$PWD/$distribution/bin/${{ matrix.seed_executable }}"
          test -s "$seed"
          chmod +x "$seed" 2>/dev/null || true
          echo "SEED_COMPILER=$seed" >> "$GITHUB_ENV"

      - name: Install Linux cross toolchains
        if: matrix.producer == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          version=20260616
          archive="llvm-mingw-$version-ucrt-ubuntu-22.04-x86_64.tar.xz"
          url="https://github.com/mstorsjo/llvm-mingw/releases/download/$version/$archive"
          curl -fsSL --retry 2 "$url" -o "target/$archive"
          test "$(sha256sum "target/$archive" | awk '{print $1}')" = \
            "534b92e067b22a6b4441f48ae9240a3341b17825d04d577eab0cf85c44b4deda"
          mkdir -p target/llvm-mingw
          tar -xJf "target/$archive" -C target/llvm-mingw --strip-components=1
          scripts/build-linux-aarch64-sysroot.sh \
            target/llvm-mingw/linux-aarch64-sysroot
          echo "LLVM_MINGW_ROOT=$PWD/target/llvm-mingw" >> "$GITHUB_ENV"

      - name: Build producer once, then emit target stage1 artifacts
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/ci-produce-stage1.sh
          scripts/ci-produce-stage1.sh \
            "$SEED_COMPILER" \
            "${{ matrix.producer }}" \
            "${{ needs.resolve-inputs.outputs.seed_tag }}" \
            ${{ matrix.targets }}

      - uses: actions/upload-artifact@v7
        with:
          name: stage1-${{ matrix.producer }}
          path: target/stage1-artifacts
          if-no-files-found: error
          retention-days: 7

  target-kits:
    name: Target kit ${{ matrix.target }}
    needs: resolve-inputs
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-w64-windows-gnu
            kind: windows
          - target: aarch64-w64-windows-gnu
            kind: windows
          - target: aarch64-unknown-linux-gnu
            kind: linux-aarch64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: trusted-dependencies
          path: target/dependency-download
      - name: Activate verified target-kit sources
        shell: bash
        run: |
          set -euo pipefail
          expected=$(awk 'NF {print tolower($1); exit}' target/dependency-download/dependencies.tar.gz.sha256)
          actual=$(sha256sum target/dependency-download/dependencies.tar.gz | awk '{print $1}')
          test "$actual" = "$expected"
          tar -xzf target/dependency-download/dependencies.tar.gz -C target
          test "$(cat target/dependencies/index-commit)" = "${{ needs.resolve-inputs.outputs.index_sha }}"
          mv target/dependencies/system-index target/system-index
      - name: Download verified Linux llvm-mingw
        shell: bash
        run: |
          set -euo pipefail
          version=20260616
          archive="llvm-mingw-$version-ucrt-ubuntu-22.04-x86_64.tar.xz"
          curl -fsSL --retry 2 \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/$version/$archive" \
            -o "target/$archive"
          test "$(sha256sum "target/$archive" | awk '{print $1}')" = \
            "534b92e067b22a6b4441f48ae9240a3341b17825d04d577eab0cf85c44b4deda"
          mkdir -p target/llvm-mingw
          tar -xJf "target/$archive" -C target/llvm-mingw --strip-components=1
      - name: Assemble Linux AArch64 sysroot
        if: matrix.kind == 'linux-aarch64'
        shell: bash
        run: |
          set -euo pipefail
          scripts/build-linux-aarch64-sysroot.sh target/llvm-mingw/sysroot
      - name: Build reproducible target kit
        shell: bash
        run: |
          set -euo pipefail
          release=$(tr -d '\r\n' < VERSION)
          version=${release%%-*}
          release_name=${release#*-}
          test "$release" = "$version-$release_name"
          args=(
            --host x86_64-unknown-linux-gnu \
            --target "${{ matrix.target }}" \
            --toolchain target/llvm-mingw \
            --platform target/system-index/packages/platform \
            --out target/target-kits \
            --compiler bin/clang \
            --linker bin/clang \
            --archiver bin/llvm-ar \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/v$release"
          )
          if [[ "${{ matrix.kind }}" == linux-aarch64 ]]; then
            args+=(--sysroot sysroot --link-arg "-fuse-ld=lld")
          fi
          scripts/build-target-kit.sh "${args[@]}"
      - uses: actions/upload-artifact@v7
        with:
          name: release-candidate-target-kit-${{ matrix.target }}
          path: target/target-kits
          if-no-files-found: error
          retention-days: 30

  converge:
    name: Converge ${{ matrix.triple }}
    needs: [resolve-inputs, stage1]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            executable: encore
            producer: linux
          - os: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
            executable: encore
            producer: linux
          - os: macos-15-intel
            triple: x86_64-apple-darwin
            executable: encore
            producer: darwin-intel
          - os: macos-15
            triple: aarch64-apple-darwin
            executable: encore
            producer: darwin
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            executable: encore.exe
            producer: windows
          - os: windows-latest
            triple: x86_64-w64-windows-gnu
            executable: encore.exe
            producer: linux
          - os: windows-11-arm
            triple: aarch64-w64-windows-gnu
            executable: encore.exe
            producer: linux
    runs-on: ${{ matrix.os }}
    env:
      GH_TOKEN: ${{ github.token }}
      ENCORE_REGISTRY_CACHE: ${{ github.workspace }}/target/registry
      ENCORE_INDEX_URL: https://raw.githubusercontent.com/encore-ecosystem/encore-index/${{ needs.resolve-inputs.outputs.index_sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify source version
        shell: bash
        run: |
          set -euo pipefail
          release=$(tr -d '\r\n' < VERSION)
          version=${release%%-*}
          release_name=${release#*-}
          test "$(sed -n 's/^version = "\([^"]*\)"/\1/p' encore.toml | head -n 1)" = "$version"
          test "$release" = "$version-$release_name"
          grep -Fq "ret \"$version\"" src/version.enq
          grep -Fq "ret \"$release_name\"" src/version.enq
          grep -Fq "ret \"$release\"" src/version.enq

      - uses: actions/download-artifact@v8
        with:
          name: trusted-dependencies
          path: target/dependency-download

      - name: Activate verified offline dependencies
        shell: bash
        run: |
          set -euo pipefail
          expected=$(awk 'NF {print tolower($1); exit}' target/dependency-download/dependencies.tar.gz.sha256)
          if command -v sha256sum >/dev/null 2>&1; then
            actual=$(sha256sum target/dependency-download/dependencies.tar.gz | awk '{print $1}')
          else
            actual=$(shasum -a 256 target/dependency-download/dependencies.tar.gz | awk '{print $1}')
          fi
          test "$actual" = "$expected"
          tar -xzf target/dependency-download/dependencies.tar.gz -C target
          rm -rf target/registry
          mv target/dependencies/registry target/registry
          cmp <(tr -d '\r' < encore.lock) target/dependencies/encore.lock
          test "$(cat target/dependencies/index-commit)" = "${{ needs.resolve-inputs.outputs.index_sha }}"
          mv target/dependencies/system-index target/system-index
          index_root="$PWD/../encore-index"
          test ! -e "$index_root"
          cp -R target/system-index "$index_root"
          echo "ENCORE_CORE_DIR=$index_root/packages/core" >> "$GITHUB_ENV"
          echo "ENCORE_INDEX_URL=http://127.0.0.1:9" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v8
        with:
          name: stage1-${{ matrix.producer }}
          path: target/stage1-download

      - name: Verify cross-produced stage1
        id: seed
        shell: bash
        run: |
          set -euo pipefail
          root="target/stage1-download/${{ matrix.triple }}"
          manifest="$root/manifest.json"
          test "$(jq -r '.schema' "$manifest")" = 2
          test "$(jq -r '.commit' "$manifest")" = "$GITHUB_SHA"
          release=$(tr -d '\r\n' < VERSION)
          test "$(jq -r '.version' "$manifest")" = "${release%%-*}"
          test "$(jq -r '.nametag' "$manifest")" = "${release#*-}"
          test "$(jq -r '.release' "$manifest")" = "$release"
          test "$(jq -r '.seed' "$manifest")" = "${{ needs.resolve-inputs.outputs.seed_tag }}"
          test "$(jq -r '.target' "$manifest")" = "${{ matrix.triple }}"
          release=$(tr -d '\r\n' < VERSION)
          version=${release%%-*}
          release_name=${release#*-}
          target_kit_abi=$(printf '%s\n' "$version" | awk -F. '{print $1 "." $2}')
          test "$(jq -r '.target_kit_abi' "$manifest")" = "$target_kit_abi"
          expected_dependencies=$(awk 'NF {print tolower($1); exit}' \
            target/dependency-download/dependencies.tar.gz.sha256)
          test "$(jq -r '.dependencies_sha256' "$manifest")" = "$expected_dependencies"
          compiler="$PWD/$root/${{ matrix.executable }}"
          if command -v sha256sum >/dev/null 2>&1; then
            actual=$(sha256sum "$compiler" | awk '{print $1}')
          else
            actual=$(shasum -a 256 "$compiler" | awk '{print $1}')
          fi
          test "$actual" = "$(jq -r '.executable_sha256' "$manifest")"
          chmod +x "$compiler" 2>/dev/null || true
          echo "STAGE1_COMPILER=$compiler" >> "$GITHUB_ENV"
          echo "tag=${{ needs.resolve-inputs.outputs.seed_tag }}" >> "$GITHUB_OUTPUT"

      - name: Install matching Windows GNU host toolchain
        if: contains(matrix.triple, 'w64-windows-gnu')
        shell: bash
        run: |
          set -euo pipefail
          version=20260616
          arch=x86_64
          checksum=b9b68a4d276e16fa25802aaba458e4638f64b3884c290aaccdc2d87083b6ca35
          if [[ "${{ matrix.triple }}" == aarch64-* ]]; then
            arch=aarch64
            checksum=312593669435bd0bfc1a43ac3fba23c8b27e0610bade88b2738e5a01702a99ba
          fi
          archive="llvm-mingw-$version-ucrt-$arch.zip"
          curl -fsSL --retry 2 \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/$version/$archive" \
            -o "target/$archive"
          test "$(sha256sum "target/$archive" | awk '{print $1}')" = "$checksum"
          mkdir -p target/llvm-mingw-host
          unzip -q "target/$archive" -d target/llvm-mingw-host
          root=$(find target/llvm-mingw-host -mindepth 1 -maxdepth 1 -type d | head -n 1)
          test -x "$root/bin/clang.exe"
          echo "ENCORE_CC=$PWD/$root/bin/clang.exe" >> "$GITHUB_ENV"
          echo "ENCORE_LINKER=$PWD/$root/bin/clang.exe" >> "$GITHUB_ENV"
          echo "ENCORE_AR=$PWD/$root/bin/llvm-ar.exe" >> "$GITHUB_ENV"

      - name: Verify byte-identical stage2/stage3 fixed point
        shell: bash
        run: |
          set -euo pipefail
          "$STAGE1_COMPILER" build --profile extreme
          mkdir -p target/stage2
          cp "target/extreme/${{ matrix.executable }}" "target/stage2/${{ matrix.executable }}"
          mv target/extreme target/stage2-output
          "target/stage2/${{ matrix.executable }}" build --profile extreme
          mkdir -p target/stage3
          cp "target/extreme/${{ matrix.executable }}" "target/stage3/${{ matrix.executable }}"
          cmp "target/stage2/${{ matrix.executable }}" "target/stage3/${{ matrix.executable }}"
          "target/stage3/${{ matrix.executable }}" --version

      - name: Verify incremental cache integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-incremental-cache.py \
            "target/stage3/${{ matrix.executable }}"

      - name: Build examples
        if: matrix.triple == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          compiler="$PWD/target/stage3/${{ matrix.executable }}"
          while IFS= read -r manifest; do
            example=${manifest%/encore.toml}
            case "$example" in examples/bare_metal|*/compile_fail) continue ;; esac
            if test -f "$example/src/main.enq"; then
              (cd "$example" && "$compiler" build)
            else
              (cd "$example" && "$compiler" check)
            fi
          done < <(find examples -mindepth 2 -name encore.toml -print | LC_ALL=C sort)
          (cd examples/bare_metal && "$compiler" build --target thumbv7em-none-eabi --emit llvm-ir)
          (cd docs/enbook-en/examples/guide && "$compiler" build)

      - name: Verify source tooling gates
        if: matrix.triple == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          compiler="$PWD/target/stage3/${{ matrix.executable }}"
          "$compiler" format --check
          "$compiler" check
          "$compiler" lint

      - name: Build matching Encore language server
        shell: bash
        run: |
          set -euo pipefail
          # Keep the index at its source-relative sibling path while building
          # the LSP: lsp/encore.toml intentionally resolves ../../encore back
          # to this compiler checkout.
          index_root="$PWD/../encore-index"
          test -f "$index_root/lsp/encore.toml"
          compiler="$PWD/target/stage3/${{ matrix.executable }}"
          (cd "$index_root/lsp" && ENCORE_CORE_DIR="$index_root/packages/core" \
            "$compiler" build --profile release)
          source_name=lsp
          installed_name=encore-lsp
          if [[ "${{ matrix.triple }}" == *-windows-* ]]; then
            source_name=lsp.exe
            installed_name=encore-lsp.exe
          fi
          cp "$index_root/lsp/target/release/$source_name" "target/stage3/$installed_name"
          chmod +x "target/stage3/$installed_name" 2>/dev/null || true

      - name: Assemble offline test context
        shell: bash
        run: |
          set -euo pipefail
          context=target/test-context
          mkdir -p "$context/bin"
          cp "target/stage3/${{ matrix.executable }}" "$context/bin/${{ matrix.executable }}"
          cp -R target/registry "$context/registry"
          cp -R target/system-index "$context/system-index"

      - uses: actions/upload-artifact@v7
        with:
          name: test-context-${{ matrix.triple }}
          path: target/test-context
          if-no-files-found: error
          retention-days: 7

      - name: Assemble release candidate
        shell: bash
        run: |
          set -euo pipefail
          release=$(tr -d '\r\n' < VERSION)
          version=${release%%-*}
          release_name=${release#*-}
          test "$release" = "$version-$release_name"
          package="encore-$release-${{ matrix.triple }}"
          root="$PWD/target/package/$package"
          mkdir -p "$root/bin" "$root/lib/encore/index" "$root/share/doc/encore" dist
          cp "target/stage3/${{ matrix.executable }}" "$root/bin/${{ matrix.executable }}"
          chmod +x "$root/bin/${{ matrix.executable }}" 2>/dev/null || true
          lsp_executable=encore-lsp
          [[ "${{ matrix.triple }}" == *-windows-* ]] && lsp_executable=encore-lsp.exe
          cp "target/stage3/$lsp_executable" "$root/bin/$lsp_executable"
          chmod +x "$root/bin/$lsp_executable" 2>/dev/null || true
          for name in core platform std rich json log profile ehir toml colorterm llvm argparse; do
            source_name=$name
            test -f "$PWD/target/system-index/packages/$source_name/encore.toml"
            cp -R "$PWD/target/system-index/packages/$source_name" "$root/lib/encore/index/$name"
          done
          cp -R "$PWD/target/system-index/packages/ehir-llvm-backend" \
            "$root/lib/encore/index/ehir-llvm-backend"
          cp LICENSE README.md "$root/share/doc/encore/"
          printf '%s\n' "$release" > "$root/VERSION"
          hash_file() {
            if command -v sha256sum >/dev/null 2>&1; then sha256sum "$1" | awk '{print $1}'
            else shasum -a 256 "$1" | awk '{print $1}'; fi
          }
          stage2_sha=$(hash_file "target/stage2/${{ matrix.executable }}")
          stage3_sha=$(hash_file "target/stage3/${{ matrix.executable }}")
          test "$stage2_sha" = "$stage3_sha"
          lsp_sha=$(hash_file "target/stage3/$lsp_executable")
          dependencies_sha=$(awk 'NF {print tolower($1); exit}' target/dependency-download/dependencies.tar.gz.sha256)
          printf '{"schema":2,"commit":"%s","version":"%s","nametag":"%s","release":"%s","seed":"%s","index_commit":"%s","dependencies_sha256":"%s","target":"%s","compiler_sha256":"%s","lsp_sha256":"%s","stage2_sha256":"%s","stage3_sha256":"%s","converged":true}\n' \
            "$GITHUB_SHA" "$version" "$release_name" "$release" "${{ steps.seed.outputs.tag }}" \
            "${{ needs.resolve-inputs.outputs.index_sha }}" "$dependencies_sha" "${{ matrix.triple }}" \
            "$stage3_sha" "$lsp_sha" "$stage2_sha" "$stage3_sha" \
            > "dist/provenance-${{ matrix.triple }}.json"
          find "$root" -exec touch -t 200001010000.00 {} +
          case "${{ matrix.triple }}" in
            *-windows-*)
              archive="$PWD/dist/encore-${{ matrix.triple }}.zip"
              (cd target/package && 7z a -tzip -mtc=off -mta=off "$archive" "$package")
              ;;
            *)
              archive="$PWD/dist/encore-${{ matrix.triple }}.tar.gz"
              if tar --version 2>/dev/null | grep -q GNU; then
                tar -C target/package --sort=name --owner=0 --group=0 --numeric-owner -czf "$archive" "$package"
              else
                (cd target/package && find "$package" -print | LC_ALL=C sort |
                  COPYFILE_DISABLE=1 tar --no-recursion --uid 0 --gid 0 --uname root --gname root -cf - -T - |
                  gzip -n > "$archive")
              fi
              ;;
          esac
          if command -v sha256sum >/dev/null 2>&1; then
            (cd dist && sha256sum "$(basename "$archive")" > "$(basename "$archive").sha256")
          else
            (cd dist && shasum -a 256 "$(basename "$archive")" > "$(basename "$archive").sha256")
          fi

      - name: Verify packaged language server without global installation
        if: matrix.triple == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          set -euo pipefail
          release=$(tr -d '\r\n' < VERSION)
          root="$PWD/target/package/encore-$release-${{ matrix.triple }}"
          # No HOME, ENCORE_HOME or development overrides: discover libraries
          # beside the packaged executable, exactly as a fresh installation.
          for suite in docstrings protocol_features scheduler workspace_graph; do
            env -i PATH=/usr/bin:/bin LANG=C.UTF-8 \
              ENCORE_INDEX_URL=http://127.0.0.1:9 \
              timeout 180 python3 "$PWD/../encore-index/lsp/tests/$suite.py" \
              "$root/bin/encore-lsp"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: release-candidate-${{ matrix.triple }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  tests:
    name: Test ${{ matrix.triple }}
    needs: converge
    strategy:
      fail-fast: false
      matrix:
        target:
          - linux-x86
          - linux-arm
          - macos-x86
          - macos-arm
          - windows-msvc-x86
          - windows-gnu-x86
          - windows-gnu-arm
        include:
          - target: linux-x86
            os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            executable: encore
          - target: linux-arm
            os: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
            executable: encore
          - target: macos-x86
            os: macos-15-intel
            triple: x86_64-apple-darwin
            executable: encore
          - target: macos-arm
            os: macos-15
            triple: aarch64-apple-darwin
            executable: encore
          - target: windows-msvc-x86
            os: windows-latest
            triple: x86_64-pc-windows-msvc
            executable: encore.exe
          - target: windows-gnu-x86
            os: windows-latest
            triple: x86_64-w64-windows-gnu
            executable: encore.exe
          - target: windows-gnu-arm
            os: windows-11-arm
            triple: aarch64-w64-windows-gnu
            executable: encore.exe
    runs-on: ${{ matrix.os }}
    env:
      ENCORE_INDEX_URL: http://127.0.0.1:9
      ENCORE_REGISTRY_CACHE: ${{ github.workspace }}/target/test-context/registry
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: test-context-${{ matrix.triple }}
          path: target/test-context
      - name: Activate pinned path dependencies
        shell: bash
        run: |
          set -euo pipefail
          index_root="$PWD/../encore-index"
          test ! -e "$index_root"
          cp -R target/test-context/system-index "$index_root"
      - name: Install matching Windows GNU host toolchain
        if: contains(matrix.triple, 'w64-windows-gnu')
        shell: bash
        run: |
          set -euo pipefail
          version=20260616
          arch=x86_64
          checksum=b9b68a4d276e16fa25802aaba458e4638f64b3884c290aaccdc2d87083b6ca35
          if [[ "${{ matrix.triple }}" == aarch64-* ]]; then
            arch=aarch64
            checksum=312593669435bd0bfc1a43ac3fba23c8b27e0610bade88b2738e5a01702a99ba
          fi
          archive="llvm-mingw-$version-ucrt-$arch.zip"
          curl -fsSL --retry 2 \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/$version/$archive" \
            -o "target/$archive"
          test "$(sha256sum "target/$archive" | awk '{print $1}')" = "$checksum"
          mkdir -p target/llvm-mingw-host
          unzip -q "target/$archive" -d target/llvm-mingw-host
          root=$(find target/llvm-mingw-host -mindepth 1 -maxdepth 1 -type d | head -n 1)
          test -x "$root/bin/clang.exe"
          echo "ENCORE_CC=$PWD/$root/bin/clang.exe" >> "$GITHUB_ENV"
          echo "ENCORE_LINKER=$PWD/$root/bin/clang.exe" >> "$GITHUB_ENV"
          echo "ENCORE_AR=$PWD/$root/bin/llvm-ar.exe" >> "$GITHUB_ENV"
      - name: Run deterministic offline test suite
        shell: bash
        run: |
          set -euo pipefail
          compiler="$PWD/target/test-context/bin/${{ matrix.executable }}"
          chmod +x "$compiler" 2>/dev/null || true
          "$compiler" test \
            --report "target/test-report.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-report-${{ matrix.triple }}
          path: |
            target/test-report.json
            target/tests/*.output.txt
          if-no-files-found: warn
          retention-days: 7
